<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/rekisteröitymislomake.js" defer></script>
    <link rel="stylesheet" href="../css/rekisteröitymislomake.css">
    <title>Document</title>
</head>
<body>
    <main>
        <section>
            <article>
                <form id="form" action="">
                <label for="name">Nimi</label>
                <input type="name" id="name" name="name" minlength="2" required>
                <label for="email">Sähköposti</label>
                <input type="email" id="email" name="email" required>
                <label for="password">Salasana</label>
                <input type="password" id="password" name="password" required>
                <label for="password2">Salasanan vahvistus</label>
                <input type="password" id="password2" name="password2" required>
                <label for="checkbox">Hyväksy ehdot</label>
                <input type="checkbox" id="ehdot" name="ehdot" required>
                <button type="submit" id="lähetä">Lähetä</button>
                </form>
            </article>
        </section>
    </main>
</body>
</html>
