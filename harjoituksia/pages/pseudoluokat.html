<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/pseudoluokat.css">
    <title>Document</title>
</head>
<body>
    <main>
        <section>
            <article id="painikejärjestelmä">
                <button id="primary-btn"></button>
                <label for="primary-btn">Ykkösnappi</label>
                <button id="secondary-btn"></button>
                <label for="secondary-btn">Kakkosnappi</label>
            </article>
        </section>
        <section>
            <article id="lomakekortti">
                <form>
                    <legend style="font-weight: 800;">Lomakekortti</legend>
                    <input type="name" id="nimikenttä" placeholder="Nimi" required>
                    <label for="nimikenttä">Nimikenttä</label>
                    <input type="email" id="emailkenttä" placeholder="Sähköpostiosoite">
                    <label for="emailkenttä">Sähköposti</label>
                    <input type="checkbox" id="checkboxi">
                    <label for="checkboxi">Hyväksyn</label>
                    <input type="text" id="Palaute" placeholder="Palaute" disabled>
                    <label for="Palaute">Palaute</label>
                </form>
            </article>
        </section>
        <section>
            <div id="smartcard">
                <p>Fiksu kortti</p>
                <img src="../images/ccg.jpg" alt="Caligula's horse levyn kansi" id="kuva">
            </div>
        </section>
    </main>
</body>
</html>
