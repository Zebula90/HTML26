<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--Header sopii sivun yläosaan, korvaa hyvin div-luokan top-->
    <header class="top"></header>
        <!--Nav sopii sivulla navigointiin, tiedetään heti että tällä liikutaan sivulla.-->
        <nav aria-label="menu"></nav>
    <!--Main kuvaa paremmin pääsisältöä kuin div luokalla content-->
    <main class="content">
        <!--Article kuvaa mainin sisällä olevaa julkaisua. Korvaa hyvin div luokan post.-->
        <article class="post">
            <header> </header>
            <section></section>
            <section></section>  
        </article>
    </main>
    <!--Aside on tyypillisesti sivun oikeaan reunaan sijoitettu sisältö. Korvaa hyvin divin side.-->
    <aside class="side"></aside>
    <!--Footerilla viitataan sivun pohjaan/alatunnisteeseen. Korvaa hyvin divin bottom.-->
    <footer class="bottom"></footer>
</body>
</html>
